<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earn Money App</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4CAF50">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            background-color: #4CAF50;
            color: white;
            width: 100%;
            padding: 15px 0;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .container {
            width: 90%;
            max-width: 400px;
            background: white;
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
        .balance-box {
            background: #e8f5e9;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .balance-title {
            font-size: 14px;
            color: #555;
        }
        .balance-amount {
            font-size: 28px;
            color: #2e7d32;
            font-weight: bold;
        }
        .btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .btn:active {
            background-color: #388e3c;
        }
        .btn-withdraw {
            background-color: #ff9800;
        }
        .btn-withdraw:active {
            background-color: #e65100;
        }
        input {
            width: 90%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <header>Earn Money App</header>

    <div class="container">
        <div class="balance-box">
            <div class="balance-title">உங்கள் இருப்பு (Balance)</div>
            <div class="balance-amount">₹<span id="balance">0.00</span></div>
        </div>

        <button class="btn" onclick="watchAd()">🎥 Watch Ad (Earn ₹0.30)</button>

        <hr style="margin: 20px 0; border: 0.5px solid #eee;">

        <h3>வித் டிராவல் கோரிக்கை (Withdrawal)</h3>
        <p style="font-size: 12px; color: #777;">குறைந்தபட்ச வித் டிராவல்: ₹50<br>(செயலாக்க நேரம்: 24-72 மணி நேரம்)</p>
        <input type="text" id="upiId" placeholder="UPI ID / PhonePe Number">
        <input type="number" id="withdrawAmount" placeholder="தொகை (Amount ₹)">
        <button class="btn btn-withdraw" onclick="requestWithdrawal()">பணம் பெறவும் (Withdraw)</button>
    </div>

    <script>
        // Monetag Direct Link
        const MONETAG_AD_LINK = "https://uplcm.com/4/82025129";

        let balance = parseFloat(localStorage.getItem('user_balance')) || 0.00;
        document.getElementById('balance').innerText = balance.toFixed(2);

        function watchAd() {
            // Open Monetag Ad Direct Link in new tab
            window.open(MONETAG_AD_LINK, '_blank');
            
            // Add reward of ₹0.30
            balance += 0.30;
            localStorage.setItem('user_balance', balance);
            document.getElementById('balance').innerText = balance.toFixed(2);
            alert("விளம்பரத்தைப் பார்த்ததற்கு ₹0.30 உங்கள் கணக்கில் சேர்க்கப்பட்டது!");
        }

        function requestWithdrawal() {
            const upi = document.getElementById('upiId').value;
            const amount = parseFloat(document.getElementById('withdrawAmount').value);

            if (!upi) {
                alert("தயவுசெய்து உங்கள் UPI ID அல்லது PhonePe எண்ணை உள்ளிடவும்!");
                return;
            }

            if (isNaN(amount) || amount < 50) {
                alert("குறைந்தபட்சம் ₹50 ரூபாய் மட்டுமே வித் டிரா செய்ய முடியும்!");
                return;
            }

            if (amount > balance) {
                alert("உங்கள் கணக்கில் போதுமான இருப்பு இல்லை!");
                return;
            }

            balance -= amount;
            localStorage.setItem('user_balance', balance);
            document.getElementById('balance').innerText = balance.toFixed(2);

            alert("உங்கள் வித் டிராவல் கோரிக்கை சமர்ப்பிக்கப்பட்டது! 24-72 மணி நேரத்திற்குள் பணம் உங்கள் கணக்கில் வரவு வைக்கப்படும்.");
            document.getElementById('upiId').value = '';
            document.getElementById('withdrawAmount').value = '';
        }

        // Service Worker Register for PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
